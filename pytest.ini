[tool:pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    phase1: Phase 1 tests - File explorer and visual permission indicators
    phase2: Phase 2 tests - Config-file driven permission system
    phase3a: Phase 3A tests - Database-driven workspace backend
    phase3b: Phase 3B tests - Advanced workspace UI components
    integration: Integration tests across multiple components
    performance: Performance and benchmark tests
    security: Security validation tests
    unit: Unit tests for individual components
    slow: Tests that take more than 1 second to run